format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$kubernetes\
$status\
$character"""

right_format = """$time"""

# Base prompt components

[time]
disabled = false

[username]
style_user = "fg:white bg:bright-black"
style_root = "italic fg:black bg:bright-blue"
format = '[ $user ]($style)'
disabled = false
show_always = true

[hostname]
ssh_only = true
style = "fg:white bg:bright-black"
format = '[$ssh_symbol$hostname ]($style)'
disabled = false

[directory]
read_only = "󰌾"
style = "fg:black bg:blue"
format = "[ $path ]($style) "
truncation_length = 5
truncation_symbol = ".../"
truncate_to_repo = false

# NOTE: Order must be from most specific path to most general
[directory.substitutions]
"~/repos/personal" = " 󰳐 "
"~/repos/work" = "󰃖 󰳐 "
"~/notes/personal" = "  "
"~/notes/work" = "󰃖  "
"~/repos" = "󰳐 "
"~/notes" = " "
"~" = " "

[status]
symbol = ' '
disabled = false

# Git tags

[git_branch]
symbol = " "
style = "fg:black bg:cyan"
format = '[ $symbol [$branch](italic $style)]($style)'

[git_status]
ahead = '⇡${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
untracked = '?${count}'
modified = '!${count}'
staged = '+${count}'
deleted = '✘${count}'
renamed = '»${count}'
style = "bold fg:black bg:cyan"
format = '[ $all_status$ahead_behind ]($style) '
ignore_submodules = true

[git_state]
disabled = false
style = "fg:black bg:bright-red"
format = '[ $state [$progress_current/$progress_total](italic $style) ]($style) '

# Kubernetes

[kubernetes]
style = "fg:white bg:bright-black"
format = '[ $symbol[$context( \($namespace\))](italic $style) ]($style) '
disabled = false
